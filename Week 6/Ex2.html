<!DOCTYPE html>
<html>
    <head>

        <title>Student Registration Form</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    </head>

    <body class="bg-light">

        <div class="container mt-5">

            <div class="row justify-content-center">
                <div class="col-md-8">

                    <h2 class="text-center mb-4">Student Registration Form</h2>


                    <div id="successAlert" class="alert alert-success d-none">
                        Registration submitted successfully!
                    </div>

                    <form onsubmit="showAlert(event)">


                        <div class="mb-3">
                            <label class="form-label">Student Name</label>
                            <input type="text" class="form-control" placeholder="Enter your name" required>
                        </div>


                        <div class="mb-3">
                            <label class="form-label">Roll Number</label>
                            <input type="text" class="form-control" placeholder="Enter roll number" required>
                        </div>


                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" placeholder="Enter email" required>
                        </div>


                        <div class="mb-3">
                            <label class="form-label">Gender</label><br>

                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender">
                            <label class="form-check-label">Male</label>
                        </div>

                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender">
                            <label class="form-check-label">Female</label>
                        </div>

                    </div>


                    <div class="mb-3">
                        <label class="form-label">Department</label>

                        <select class="form-select">
                            <option selected disabled>Select Department</option>
                            <option>Computer Science</option>
                            <option>Information Technology</option>
                            <option>Electronics</option>
                            <option>Mechanical</option>
                        </select>

                    </div>


                    <div class="mb-3">
                        <label class="form-label">Subjects</label>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox">
                            <label class="form-check-label">Data Mining</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox">
                            <label class="form-check-label">DBMS</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox">
                            <label class="form-check-label">Robotics</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox">
                            <label class="form-check-label">Web Development</label>
                        </div>

                    </div>

                    <div class="mb-3">
                        <label class="form-label">Upload Photo</label>
                        <input type="file" class="form-control">
                    </div>


                    <div class="text-center">

                        <button type="submit" class="btn btn-primary me-2">
                        Submit
                        </button>

                        <button type="reset" class="btn btn-secondary">
                        Reset
                        </button>

                    </div>

                </form>

            </div>
        </div>

    </div>
            <script>

                function showAlert(event)
                {
                event.preventDefault();

                document.getElementById("successAlert").classList.remove("d-none");
                }

            </script>

        </body>
    </html>
